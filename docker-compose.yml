name: jungle-wagering

services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wagering}
      POSTGRES_USER: ${POSTGRES_USER:-wagering_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  localstack:
    image: localstack/localstack:4.12.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      PERSISTENCE: "0"
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -Eq '\"sqs\"[[:space:]]*:[[:space:]]*\"(running|available)\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-wagering_app}:${POSTGRES_PASSWORD:-local_only_change_me}@postgres:5432/${POSTGRES_DB:-wagering}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
